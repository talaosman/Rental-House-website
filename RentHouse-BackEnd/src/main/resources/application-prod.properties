# Production database (Railway)
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

# OAuth redirect URIs (production)
spring.security.oauth2.client.registration.google.redirect-uri=https://rental-house-website.onrender.com/login/oauth2/code/google
spring.security.oauth2.client.registration.github.redirect-uri=https://rental-house-website.onrender.com/login/oauth2/code/github